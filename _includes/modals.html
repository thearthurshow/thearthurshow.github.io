<!-- Game Modals -->
{% assign games = site.games | sort: "order" %}

{% for game in games %}
<div
  class="portfolio-modal modal fade"
  id="portfolioModal-{{ game.modal-id }}"
  tabindex="-1"
  role="dialog"
  aria-hidden="true">

  <div class="modal-content">
    <div class="close-modal" data-dismiss="modal">
      <div class="lr">
        <div class="rl"></div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        <div class="col-lg-8 col-lg-offset-2">
          <div class="modal-body">
            <h2>{{ game.title }}</h2>

            <hr class="star-primary">

            <img
              src="{{ '/img/games/' | append: game.img | relative_url }}"
              class="img-responsive img-centered"
              alt="{{ game.alt }}">

            {% if game.description %}
             <div class="game-description">
                {{ game.description | markdownify }}
              </div>
            {% endif %}

            <button
              type="button"
              class="btn btn-default"
              data-dismiss="modal">
              <i class="fa fa-times"></i>
              Close
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endfor %}
