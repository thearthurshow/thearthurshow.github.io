<!-- Portfolio Grid Section -->
<section id="games">
  <div class="container portfolio-flex-grid">
    <div class="row">
      <div class="col-lg-12 text-center">
        <h2>Games</h2>
        <hr class="star-primary">
      </div>
    </div>
    <div class="portfolio-flex-row">
      {% assign games = site.games | sort: "order" %}

      {% for game in games %}
      <div class="portfolio-flex-item portfolio-item">
        <a href="#portfolioModal-{{ game.modal-id }}" class="portfolio-link" data-toggle="modal">
          <div class="caption">
            <div class="caption-content">
              <i class="fa fa-search-plus fa-3x"></i>
            </div>
          </div>
          <img src="img/games/{{ game.img }}" class="img-responsive" alt="{{ game.alt }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
